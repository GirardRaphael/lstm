name: tests

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src app scripts tests
      - run: PYTHONPATH=src python tests/test_pipeline.py
      - run: PYTHONPATH=src python tests/test_saved_models.py
      - run: PYTHONPATH=src python tests/test_app.py
      - run: PYTHONPATH=src python tests/test_readiness.py
